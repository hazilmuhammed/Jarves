<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>JARVIS — Personal AI Assistant</title>
                <link rel="stylesheet" href="styles.css">
                </head>
                <body>

                    <!-- Background Canvas for Graph Visualization -->
                        <canvas id="graphCanvas"></canvas>

                            <!-- UI Overlay Grid -->
                                <div class="ui-container">
                                        
                                                <!-- Left Panel: Inspector & Top Hubs -->
                                                        <aside class="panel left-panel">
                                                                    <div class="panel-header">
                                                                                    <h2>Inspector</h2>
                                                                                                </div>
                                                                                                            <div id="inspectorContent" class="panel-body">
                                                                                                                            <p class="placeholder-text">Click a node on the graph to inspect note details.</p>
                                                                                                                                        </div>
                                                                                                                                                    
                                                                                                                                                                <div class="panel-header border-top">
                                                                                                                                                                                <h2>Top Hubs</h2>
                                                                                                                                                                                            </div>
                                                                                                                                                                                                        <ul id="topHubsList" class="hub-list">
                                                                                                                                                                                                                        <!-- Dynamically populated hubs -->
                                                                                                                                                                                                                                    </ul>
                                                                                                                                                                                                                                            </aside>

                                                                                                                                                                                                                                                    <!-- Right Panel: Reactor HUD & Filters -->
                                                                                                                                                                                                                                                            <aside class="panel right-panel">
                                                                                                                                                                                                                                                                        <div class="reactor-container">
                                                                                                                                                                                                                                                                                        <div id="reactorHUD" class="reactor idle">
                                                                                                                                                                                                                                                                                                            <div class="reactor-core"></div>
                                                                                                                                                                                                                                                                                                                                <div class="reactor-ring outer"></div>
                                                                                                                                                                                                                                                                                                                                                    <div class="reactor-ring inner"></div>
                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                    <div id="reactorStateText" class="reactor-status">IDLE</div>
                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                            <div class="panel-header border-top">
                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>Node Filters</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="filterList" class="filter-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Filter counts populated via JavaScript -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </aside>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Bottom Panel: Voice / Controls & Input -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <footer class="bottom-panel">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="audio-visualizer-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="liveAudioBar" class="audio-level-fill"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="captionBox" class="live-caption">Listening for voice command...</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="control-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="action-buttons">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="btnMic" class="btn btn-mic" title="Toggle Microphone">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="btnMute" class="btn">Mute</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button id="btnBrief" class="btn">Brief Me</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="btnPlan" class="btn">Plan Day</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="btnMemory" class="btn">Memory</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="input-wrapper">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="askInput" placeholder="Ask JARVIS something... (e.g. 'Brief me on today's schedule')" autocomplete="off">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button id="btnSend" class="btn btn-accent">Send</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Scripts -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="graph.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="app.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
